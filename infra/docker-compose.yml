services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fabmind-postgres
    environment:
      POSTGRES_USER: fabmind
      POSTGRES_PASSWORD: fabmind
      POSTGRES_DB: fabmind
    ports:
      - "5432:5432"
    volumes:
      - fabmind_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fabmind-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: fabmind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fabmind
      MINIO_ROOT_PASSWORD: fabmind123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fabmind_minio:/data

volumes:
  fabmind_pg:
  fabmind_minio:
