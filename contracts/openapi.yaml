openapi: 3.1.0
info:
  title: FabMind Agent API
  version: 1.0.0
  description: On-premise evidence-first troubleshooting API for Load Port / FOUP Clamp equipment.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      summary: Demo login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/equipment:
    get:
      summary: List equipment
      responses:
        '200':
          description: Equipment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EquipmentSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment/{equipment_id}:
    get:
      summary: Get equipment detail aggregate
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Equipment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/alarms:
    get:
      summary: List alarm codes
      responses:
        '200':
          description: Alarm code list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlarmCode'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/io-points:
    get:
      summary: List I/O points
      responses:
        '200':
          description: I/O point list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IoPoint'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ethercat-devices:
    get:
      summary: List EtherCAT devices
      responses:
        '200':
          description: EtherCAT device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EthercatDevice'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/diagnosis-sessions:
    get:
      summary: List diagnosis sessions
      responses:
        '200':
          description: Diagnosis session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create diagnosis session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnosisSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/diagnosis-sessions/{session_id}:
    get:
      summary: Get diagnosis session aggregate
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Diagnosis session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/analyze:
    post:
      summary: Run deterministic diagnosis analysis
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/checklist-runs:
    post:
      summary: Create checklist run from latest completed agent analysis
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Checklist run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/report-drafts:
    post:
      summary: Create deterministic report draft from analysis and checklist
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Report draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/checklist-runs/{checklist_run_id}:
    get:
      summary: Get checklist run detail
      parameters:
        - name: checklist_run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Checklist run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/checklist-runs/{checklist_run_id}/items/{item_id}:
    patch:
      summary: Update checklist item status or field note
      parameters:
        - name: checklist_run_id
          in: path
          required: true
          schema: { type: string }
        - name: item_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Updated checklist run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/report-drafts/{report_draft_id}:
    get:
      summary: Get report draft detail
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Report draft detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/submit:
    post:
      summary: Submit report draft for approval
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Submitted report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/approve:
    post:
      summary: Approve submitted report draft
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportApprovalRequest'
      responses:
        '200':
          description: Approved report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/reject:
    post:
      summary: Reject submitted report draft
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRejectionRequest'
      responses:
        '200':
          description: Rejected report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/audit-events:
    get:
      summary: Search audit events
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, display_name, role, tenant_id]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [FIELD_ENGINEER, SENIOR_ENGINEER, ADMIN] }
        tenant_id: { type: string }
    EquipmentSummary:
      type: object
      required: [id, code, name, family]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        family: { type: string }
        status: { type: string }
    EquipmentDetail:
      type: object
      required: [equipment, alarms, io_points, ethercat_devices, document_chunks]
      properties:
        equipment: { $ref: '#/components/schemas/EquipmentSummary' }
        alarms:
          type: array
          items: { $ref: '#/components/schemas/AlarmCode' }
        io_points:
          type: array
          items: { $ref: '#/components/schemas/IoPoint' }
        ethercat_devices:
          type: array
          items: { $ref: '#/components/schemas/EthercatDevice' }
        document_chunks:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
    AlarmCode:
      type: object
      required: [code, title, severity]
      properties:
        code: { type: string }
        title: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    IoPoint:
      type: object
      required: [code, direction, description]
      properties:
        code: { type: string }
        direction: { type: string, enum: [DI, DO] }
        description: { type: string }
    EthercatDevice:
      type: object
      required: [slave_no, name, expected_state]
      properties:
        slave_no: { type: integer }
        name: { type: string }
        expected_state: { type: string, enum: [INIT, PRE_OP, SAFE_OP, OP] }
    CreateDiagnosisSessionRequest:
      type: object
      required: [equipment_id, alarm_code, symptom_summary]
      properties:
        equipment_id: { type: string }
        alarm_code: { type: string }
        symptom_summary: { type: string }
        log_excerpt: { type: string }
        ethercat_state: { type: string, enum: [INIT, PRE_OP, SAFE_OP, OP, UNKNOWN] }
        io_snapshot:
          type: object
          additionalProperties: { type: boolean }
        recent_action: { type: string }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    SituationSnapshot:
      type: object
      properties:
        ethercat_state: { type: string, enum: [INIT, PRE_OP, SAFE_OP, OP, UNKNOWN] }
        io_snapshot:
          type: object
          additionalProperties: { type: boolean }
        recent_action: { type: string }
        log_text: { type: string }
    DiagnosisSession:
      type: object
      required: [id, tenant_id, equipment_id, created_by_user_id, alarm_code, symptom_summary, status, risk_level]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        equipment_id: { type: string }
        created_by_user_id: { type: string }
        alarm_code: { type: string }
        symptom_summary: { type: string }
        log_excerpt: { type: string }
        ethercat_state: { type: string, enum: [INIT, PRE_OP, SAFE_OP, OP, UNKNOWN] }
        io_snapshot:
          type: object
          additionalProperties: { type: boolean }
        recent_action: { type: string }
        status: { type: string, enum: [CREATED, ANALYZING, ANALYSIS_READY, INSUFFICIENT_EVIDENCE, CLOSED] }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DiagnosisSessionAggregate:
      type: object
      properties:
        session: { $ref: '#/components/schemas/DiagnosisSession' }
        agent_run: { $ref: '#/components/schemas/AgentRunResult' }
        report: { $ref: '#/components/schemas/ReportDraft' }
    AgentRunResult:
      type: object
      required: [run_id, session_id, status, mode, safety_result, risk_level, steps, hypotheses, evidence, inspection_plan_items]
      properties:
        run_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [COMPLETED, INSUFFICIENT_EVIDENCE, SAFETY_BLOCKED, FAILED] }
        mode: { type: string, enum: [DETERMINISTIC] }
        safety_result:
          type: string
          enum: [SAFE_READ_ONLY, APPROVAL_REQUIRED_FOR_FORCE_ACTION, POLICY_BLOCKED_RISKY_ACTION]
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        hypotheses:
          type: array
          items: { $ref: '#/components/schemas/Hypothesis' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceLink' }
        inspection_plan_items:
          type: array
          items: { $ref: '#/components/schemas/InspectionPlanItem' }
    AgentStep:
      type: object
      required: [id, step_order, name, status]
      properties:
        id: { type: string }
        step_order: { type: integer }
        name: { type: string }
        status: { type: string, enum: [COMPLETED, NEEDS_MORE_EVIDENCE, BLOCKED] }
        summary: { type: string }
        details: { type: object }
    Hypothesis:
      type: object
      required: [id, rank, title, confidence_band, risk_level, evidence_ids, recommended_next_checks]
      properties:
        id: { type: string }
        rank: { type: integer }
        title: { type: string }
        reasoning: { type: string }
        confidence_band: { type: string, enum: [HIGH, MEDIUM, LOW] }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        evidence_ids:
          type: array
          items: { type: string }
        recommended_next_checks:
          type: array
          items: { type: string }
    EvidenceLink:
      type: object
      required: [id, source_type, source_code, title, excerpt, relevance_reason]
      properties:
        id: { type: string }
        hypothesis_id: { type: string }
        source_type: { type: string }
        source_code: { type: string }
        title: { type: string }
        excerpt: { type: string }
        relevance_reason: { type: string }
    InspectionPlanItem:
      type: object
      required: [id, item_order, title, instruction, safety_level, evidence_codes]
      properties:
        id: { type: string }
        item_order: { type: integer }
        title: { type: string }
        instruction: { type: string }
        expected_observation: { type: string }
        safety_level: { type: string, enum: [NORMAL, CAUTION, APPROVAL_REQUIRED] }
        evidence_codes:
          type: array
          items: { type: string }
    ChecklistRun:
      type: object
      required: [id, tenant_id, diagnosis_session_id, agent_run_id, created_by_user_id, status, items]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        diagnosis_session_id: { type: string }
        agent_run_id: { type: string }
        created_by_user_id: { type: string }
        status: { type: string, enum: [CREATED, IN_PROGRESS, COMPLETED, BLOCKED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
    ChecklistItem:
      type: object
      required: [id, tenant_id, checklist_run_id, source_inspection_plan_item_id, item_order, title, description, status]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        checklist_run_id: { type: string }
        source_inspection_plan_item_id: { type: string }
        item_order: { type: integer }
        title: { type: string }
        description: { type: string }
        expected_result: { type: string }
        status: { type: string, enum: [TODO, IN_PROGRESS, DONE, BLOCKED, SKIPPED] }
        field_note: { type: string }
        completed_by_user_id: { type: string }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateChecklistItemRequest:
      type: object
      properties:
        status: { type: string, enum: [TODO, IN_PROGRESS, DONE, BLOCKED, SKIPPED] }
        field_note: { type: string }
    Evidence:
      type: object
      required: [id, type, title, content]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        content: { type: string }
    ReportDraft:
      type: object
      required:
        - id
        - tenant_id
        - diagnosis_session_id
        - agent_run_id
        - checklist_run_id
        - created_by_user_id
        - title
        - summary
        - root_cause
        - evidence_summary
        - inspection_summary
        - recommended_action
        - safety_notes
        - status
        - approvals
      properties:
        id: { type: string }
        tenant_id: { type: string }
        diagnosis_session_id: { type: string }
        agent_run_id: { type: string }
        checklist_run_id: { type: string }
        created_by_user_id: { type: string }
        title: { type: string }
        summary: { type: string }
        root_cause: { type: string }
        evidence_summary: { type: string }
        inspection_summary: { type: string }
        recommended_action: { type: string }
        safety_notes: { type: string }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/ReportApproval' }
    ReportApproval:
      type: object
      required: [id, tenant_id, report_draft_id, approver_user_id, decision, decided_at, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        report_draft_id: { type: string }
        approver_user_id: { type: string }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        comment: { type: string }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ReportApprovalRequest:
      type: object
      properties:
        comment: { type: string }
    ReportRejectionRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string }
        severity: { type: string }
        created_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code: { type: string }
        message: { type: string }
        details: { type: object }
        request_id: { type: string }
