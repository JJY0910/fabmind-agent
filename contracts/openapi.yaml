openapi: 3.1.0
info:
  title: FabMind Agent API
  version: 1.0.0
  description: On-premise evidence-first troubleshooting API for Load Port / FOUP Clamp equipment.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/equipment:
    get:
      summary: List equipment
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Equipment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment/{equipment_id}:
    get:
      summary: Get equipment detail aggregate
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Equipment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/alarms:
    get:
      summary: List alarm codes
      responses:
        '200':
          description: Alarm code list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlarmCode'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/io-points:
    get:
      summary: List I/O points
      responses:
        '200':
          description: I/O point list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IoPoint'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ethercat-devices:
    get:
      summary: List EtherCAT devices
      responses:
        '200':
          description: EtherCAT device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EthercatDevice'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/diagnosis-sessions:
    get:
      summary: List diagnosis sessions
      responses:
        '200':
          description: Diagnosis session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create diagnosis session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnosisSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/diagnosis-sessions/{session_id}:
    get:
      summary: Get diagnosis session aggregate
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Diagnosis session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/analyze:
    post:
      summary: Run deterministic diagnosis analysis
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/incidents:
    get:
      summary: List active incidents derived from diagnosis sessions
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: risk_level
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/incidents/{incident_id}:
    get:
      summary: Get incident detail
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/checklist-runs:
    post:
      summary: Create checklist run from latest completed agent analysis
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Checklist run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/diagnosis-sessions/{session_id}/report-drafts:
    post:
      summary: Create deterministic report draft from analysis and checklist
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Report draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/checklist-runs:
    get:
      summary: List checklist runs
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [CREATED, IN_PROGRESS, COMPLETED, BLOCKED] }
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: diagnosis_session_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Checklist run list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRunListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/checklist-runs/{checklist_run_id}:
    get:
      summary: Get checklist run detail
      parameters:
        - name: checklist_run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Checklist run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/checklist-runs/{checklist_run_id}/items/{item_id}:
    patch:
      summary: Update checklist item status or field note
      parameters:
        - name: checklist_run_id
          in: path
          required: true
          schema: { type: string }
        - name: item_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Updated checklist run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistRun'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/report-drafts:
    get:
      summary: List report drafts
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED] }
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Report draft list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraftListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/report-drafts/{report_draft_id}:
    get:
      summary: Get report draft detail
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Report draft detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/submit:
    post:
      summary: Submit report draft for approval
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Submitted report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/approve:
    post:
      summary: Approve submitted report draft
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportApprovalRequest'
      responses:
        '200':
          description: Approved report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/report-drafts/{report_draft_id}/reject:
    post:
      summary: Reject submitted report draft
      parameters:
        - name: report_draft_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRejectionRequest'
      responses:
        '200':
          description: Rejected report draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDraft'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/approvals:
    get:
      summary: List report approval queue
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Approval queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalQueueResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/safety-settings:
    get:
      summary: Get read-only system safety settings
      responses:
        '200':
          description: System safety settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSafetySettings'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment-data/alarm-events:
    post:
      summary: Ingest read-only equipment alarm event telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentAlarmEventRequest'
      responses:
        '201':
          description: Alarm event ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAlarmEvent'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List read-only equipment alarm events
      parameters:
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: risk_level
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, CLEARED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Alarm event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAlarmEventListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment-data/io-snapshots:
    post:
      summary: Ingest read-only equipment I/O state snapshot telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentIOSnapshotRequest'
      responses:
        '201':
          description: I/O snapshot ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentIOSnapshot'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List read-only equipment I/O state snapshots
      parameters:
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: I/O snapshot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentIOSnapshotListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment-data/ethercat-status-snapshots:
    post:
      summary: Ingest read-only EtherCAT status snapshot telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentEthercatStatusSnapshotRequest'
      responses:
        '201':
          description: EtherCAT status snapshot ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentEthercatStatusSnapshot'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List read-only EtherCAT status snapshots
      parameters:
        - name: equipment_id
          in: query
          schema: { type: string }
        - name: equipment_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: EtherCAT status snapshot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentEthercatStatusSnapshotListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/dashboard/summary:
    get:
      summary: Get tenant-scoped dashboard summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/audit-events:
    get:
      summary: Search audit events
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, display_name, role, tenant_id]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [FIELD_ENGINEER, SENIOR_ENGINEER, ADMIN] }
        tenant_id: { type: string }
    EquipmentSummary:
      type: object
      required:
        - id
        - code
        - name
        - family
        - status
        - equipment_id
        - equipment_code
        - equipment_name
        - equipment_type
        - subsystem
        - operational_status
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        family: { type: string }
        status: { type: string }
        equipment_id: { type: string }
        equipment_code: { type: string }
        equipment_name: { type: string }
        equipment_type: { type: string }
        subsystem: { type: string }
        location: { type: string }
        line_code: { type: string }
        operational_status: { type: string }
        current_alarm_code: { type: string }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        last_seen_at: { type: string, format: date-time }
        linked_diagnosis_session_id: { type: string }
    EquipmentListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EquipmentSummary' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    EquipmentDetail:
      type: object
